name: Build FieldReady Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'android-overrides/**'
      - 'scripts/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate study assessment configuration
        run: npm run verify

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Sync web app and plugins
        run: npx cap sync android

      - name: Apply FieldReady app icon
        run: bash scripts/apply-android-branding.sh

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FieldReady-Competency-Study-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldReady-Competency-Study-APK
          path: FieldReady-Competency-Study-debug.apk
          if-no-files-found: error
          retention-days: 30
